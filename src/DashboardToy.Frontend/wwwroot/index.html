<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orleans Activation Rebalancing</title>
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link href="css/site.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/6.2.0/d3.min.js"></script>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #callGraphContainer {
            width: 100%;
            height: 100%;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        text {
            text-anchor: middle;
            font-family: "Helvetica Neue", Helvetica, sans-serif;
            font-size: 16px;
        }

        .absolute-button {
            position: absolute;
            padding: 10px 20px;
            font-size: 20px;
            border: none;
            color: white;
            background-color: #007bff;
            cursor: pointer;
        }

        #toggleGrainsButton {
            top: 10px;
            left: 10px;
        }

        /* --- CSS FOR TOOLTIP --- */
        #tooltip {
            position: absolute;
            opacity: 0;
            background-color: #333;
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 14px;
            pointer-events: none; /* Prevents the tooltip from blocking mouse events */
            transition: opacity 0.2s;
            white-space: pre-wrap;
            max-width: 300px;
            text-align: left;
        }
    </style>
</head>
<body>
    <!-- --- HTML ELEMENT FOR TOOLTIP --- -->
    <div id="tooltip"></div>

    <div id="callGraphContainer">
        <svg>
            <g class="graph-container">
                <g class="links"></g>
                <g class="nodes"></g>
            </g>
        </svg>
    </div>
    <button id="toggleGrainsButton" class="absolute-button">Pause</button>

    <script type="text/javascript">
        const state = { nodes: [], links: [], isUpdate: false };

        const svg = d3.select("svg");
        let width = svg.node().clientWidth;
        let height = svg.node().clientHeight;
        let isPaused = false;
        let selectedNodeId = null;

        function mergeObjects(updated, existing) {
            for (let key in existing) {
                if (existing.hasOwnProperty(key) && !updated.hasOwnProperty(key)) {
                    updated[key] = existing[key];
                }
            }
        }

        async function loadData() {
            try {
                const data = await fetch("/data.json");
                const jsonData = await data.json();
                mergeData(jsonData);
                renderGraph();
            } catch (error) {
                console.error("Error fetching or parsing data:", error);
            }
        }

        window.onload = async function () {
            await loadData();
        };

        setInterval(async function () {
            if (!isPaused) {
                state.isUpdate = true;
                await loadData();
            }
        }, 5000);

        function mergeData(jsonData) {
            const newHostNodes = jsonData.hostIds.map((d, i) => ({
                id: "host-" + i,
                name: d.name,
                isHost: true,
                index: i,
                activationCount: d.activationCount,
            }));

            const newGrainNodes = jsonData.grainIds.map((d, i) => ({
                id: "grain-" + d.name,
                host: d.host,
                name: d.name,
                key: d.key,
                type: "grain",
                weight: d.weight
            }));
            const newNodes = newHostNodes.concat(newGrainNodes);

            const newGrainLinks = jsonData.edges.map((d) => {
                var source = jsonData.grainIds[d.source];
                var target = jsonData.grainIds[d.target];
                return {
                    id: "edge(" + source.name + "," + target.name + ")",
                    source: "grain-" + source.name,
                    target: "grain-" + target.name,
                    sourceHost: source.host,
                    targetHost: target.host,
                    weight: d.weight,
                    isHostLink: false,
                };
            });

            const newHostLinks = jsonData.grainIds.map((d, i) => ({
                id: "host-edge(" + d.name + "," + d.host + ")",
                source: "grain-" + d.name,
                target: "host-" + d.host,
                distance: 100,
                isHostLink: true,
                host: d.host,
            }));

            const hostToHostLinks = [];
            for (let i = 0; i < newHostNodes.length; i++) {
                for (let j = 0; j < newHostNodes.length; j++) {
                    if (i == j) continue;
                    hostToHostLinks.push({
                        id:
                            "host-link(" +
                            newHostNodes[i].id +
                            "," +
                            newHostNodes[j].id +
                            ")",
                        source: newHostNodes[i].id,
                        target: newHostNodes[j].id,
                        isHostToHostLink: true,
                    });
                }
            }

            const newLinks = newGrainLinks
                .concat(newHostLinks)
                .concat(hostToHostLinks);

            // Merge new nodes and links into the existing state
            const nodeMap = new Map(state.nodes.map((d) => [d.id, d]));
            newNodes.forEach((node) => {
                if (nodeMap.has(node.id)) {
                    mergeObjects(node, nodeMap.get(node.id));
                } else {
                    node.x = width / 2;
                    node.y = height / 2;
                }
            });
            state.nodes = Array.from(newNodes);
            state.links = Array.from(newLinks);

            state.maxEdgeValue = jsonData.maxEdgeValue;
            state.maxActivationCount = jsonData.maxActivationCount;
        }

        function renderGraph() {
            const graphContainer = svg.select(".graph-container");

            // --- SELECT THE TOOLTIP ELEMENT ---
            const tooltip = d3.select("#tooltip");

            var colorScheme = [...d3.schemeTableau10];
            colorScheme.splice(2, 1); // Remove red since we use that for badness (inter-host links)
            const hostColor = d3.scaleOrdinal(colorScheme);
            const linkColor = d3
                .scaleSequential(d3.interpolateOrRd)
                .domain([0, state.maxEdgeValue]);

            const darknessScale = d3.scaleLinear()
                .domain([1, 10])
                .range([0, 2.5]);

            const edgeWidthScale = d3.scaleLog()
                // Domain: from 1 call up to the maximum number of calls observed.
                // Using Math.max(1, ...) prevents an invalid domain like [1, 0] if there are no calls.
                .domain([1, Math.max(1, state.maxEdgeValue)])
                // Range: map the call count to a stroke width between 1px and 8px.
                .range([1, 8])
                // Clamp ensures that any value outside the domain returns the min/max range value.
                .clamp(true);

            const nodeData = graphContainer
                .select(".nodes")
                .selectAll("g")
                .data(state.nodes, (d) => d.id)
                .join(
                    (enter) => {
                        var g = enter.append("g");
                        g.append("circle");
                        g.append("text").attr("class", "label");
                        g.filter((d) => d.isHost)
                            .append("text")
                            .attr("class", "info");
                        return g;
                    },
                    (update) => update,
                    (exit) => exit.remove()
                );

            // --- ADD MOUSE EVENTS FOR TOOLTIP ---
            nodeData
                .on("mouseover", (event, d) => {
                    tooltip.transition().duration(200).style("opacity", 0.9);
                    tooltip
                        .html(d.name.replace(/,/g, ",\n")
                                    .replace(/\//g, "/\n")) // Break long names at commas
                        .style("left", event.pageX + 15 + "px")
                        .style("top", event.pageY - 15 + "px");
                })
                .on("mousemove", (event, d) => {
                    tooltip
                        .style("left", event.pageX + 15 + "px")
                        .style("top", event.pageY - 15 + "px");
                })
                .on("mouseout", (event, d) => {
                    tooltip.transition().duration(500).style("opacity", 0);
                });
            // ------------------------------------

            // Grain label
            nodeData
                .select(".label")
                .filter((d) => false /*d.type === 'grain'*/)
                .text((d) => (d.key.includes("hosted-") ? "client" : d.key))
                .attr("dy", -10);

            // Host label
            nodeData
                .select(".label")
                .filter((d) => d.isHost)
                .text((d) => "[" + d.index + "]")
                .attr("font-weight", "bold")
                .attr("dy", -5);

            // Host info
            nodeData
                .select(".info")
                .filter((d) => d.isHost)
                .attr("dy", 15)
                .text((d) => d.activationCount);

            // Circle
            nodeData
                .select("circle")
                .attr("r", (d) =>
                    d.isHost
                        ? 10 + (15 * d.activationCount) / state.maxActivationCount
                        : 5 + d.weight
                )
                .attr("stroke", "#222")
                .attr("stroke-width", (d) => (d.isHost ? 2 : 1))
                .attr("class", (d) => (d.isHost ? "host-circle" : ""))
                .attr("fill", (d) => {
                    if (d.isHost) {
                        // Hosts get their plain, bright base color
                        return hostColor(d.index);
                    } else {
                        // Grains start with their host's base color...
                        const baseColor = d3.color(hostColor(d.host));

                        // ...then get a darkness factor based on their weight...
                        const darknessFactor = darknessScale(d.weight);

                        // ...and apply it.
                        return baseColor.darker(darknessFactor);
                    }
                });

            // Links
            const linkData = graphContainer
                .select(".links")
                .selectAll("line")
                .data(state.links, (d) => d.id)
                .join(
                    (enter) => enter.append("line"),
                    (update) => update,
                    (exit) => exit.remove()
                )
                .filter((d) => !d.isHostToHostLink)
                .attr("stroke-width", (d) => {
                    if (d.isHostLink) {
                        // Keep the links from a grain to its host very thin.
                        return 0.25;
                    }

                    // For grain-to-grain links, use the log scale.
                    // Log scales cannot process 0, so we handle that case explicitly.
                    // An edge with 0 calls will be very faint.
                    return d.weight > 0 ? edgeWidthScale(d.weight) : 0.5;
                })
                .attr("stroke", (d) =>
                    d.isHostLink
                        ? hostColor(d.host)
                        : d.sourceHost == d.targetHost
                            ? hostColor(d.sourceHost)
                            : "red"
                );

            if (state.simulation === undefined) {
                state.simulation = d3
                    .forceSimulation(state.nodes)
                    .force(
                        "center",
                        d3.forceCenter(width / 2, height / 2).strength(0.2)
                    )
                    .force(
                        "link",
                        d3
                            .forceLink(state.links)
                            .id((d) => d.id)
                            .strength((d) =>
                            {
                                if (d.isHostToHostLink) return 0.1; // Weakly keep hosts at their distance
                                if (d.isHostLink) return 1; // Strong link between a grain and its host
                                // Local links are strong to form tight clusters.
                                // Cross-silo links are weak so they don't overpower everything.
                                return d.source.host === d.target.host ? 0.4 : 0.2;
                            })
                            .distance((d) =>{
                                if (d.isHostToHostLink) return 600; // Keep hosts far apart
                                if (d.isHostLink) return 150; // Distance from grain to its host center
                                // Local links are close. Cross-silo links are long.
                                return d.source.host === d.target.host ? 15 : 30 * (1 - d.weight / state.maxEdgeValue);
                            })
                    )
                    .force(
                        "charge",
                        d3.forceManyBody().strength((d) => (d.isHost ? -150 : -50))
                    )
                    .alphaDecay(0.01) // Reduce alpha decay rate for gradual settling
                    .velocityDecay(0.3) // Reduce velocity decay rate for gradual settling
                    .on("tick", ticked);

                svg.call(
                    d3
                        .zoom()
                        .scaleExtent([0.1, 10])
                        .on("zoom", (event) => {
                            graphContainer.attr("transform", event.transform);
                        })
                );
            } else {
                state.simulation.nodes(state.nodes);
                state.simulation.force("link").links(state.links);
                state.simulation.on("tick", ticked);
                state.simulation.alpha(0.02).restart();
            }

            function updateHighlight() {
                if (!selectedNodeId) {
                    // If nothing is selected, reset everything to full opacity
                    nodeData.style("opacity", 1);
                    linkData.style("opacity", 1);
                    return;
                }

                // Create sets for quick lookups of highlighted elements
                const highlightedNodeIds = new Set([selectedNodeId]);
                const highlightedLinkIds = new Set();

                // Find all direct neighbors and connecting links
                linkData.each(function (d) {
                    // The source/target properties on the link data are now objects after the simulation runs.
                    // We need to check their IDs.
                    const sourceId = d.source.id;
                    const targetId = d.target.id;
                    if (sourceId === selectedNodeId) {
                        highlightedNodeIds.add(targetId);
                        highlightedLinkIds.add(d.id);
                    } else if (targetId === selectedNodeId) {
                        highlightedNodeIds.add(sourceId);
                        highlightedLinkIds.add(d.id);
                    }
                });

                // Apply styles based on whether the element is in our highlighted sets
                nodeData
                    .style("opacity", d => highlightedNodeIds.has(d.id) ? 1 : 0)
                    .filter(d => highlightedNodeIds.has(d.id))
                    .raise(); // Bring highlighted nodes to the front

                linkData
                    .style("opacity", d => highlightedLinkIds.has(d.id) ? 1 : 0)
                    .filter(d => highlightedLinkIds.has(d.id))
                    .raise(); // Bring highlighted links to the front (but behind nodes)
            }

            nodeData.on("click", function (event, d) {
                event.stopPropagation(); // Prevent the SVG's click handler from firing

                // Toggle selection: if clicking the same node, deselect. Otherwise, select the new one.
                selectedNodeId = (selectedNodeId === d.id) ? null : d.id;
                updateHighlight();
            });

            // Add click event handler to the SVG background to clear selection
            svg.on("click", function () {
                selectedNodeId = null;
                updateHighlight();
            });

            // Call the highlight function at the end of every render
            // to maintain the highlight state across data refreshes.
            updateHighlight();

            function ticked() {
                linkData
                    .attr("x1", (d) => d.source.x)
                    .attr("y1", (d) => d.source.y)
                    .attr("x2", (d) => d.target.x)
                    .attr("y2", (d) => d.target.y);

                nodeData.attr("transform", (d) => `translate(${d.x},${d.y})`);
            }

            window.addEventListener("resize", () => {
                width = svg.node().clientWidth;
                height = svg.node().clientHeight;
                state.simulation.force(
                    "center",
                    d3.forceCenter(width / 2, height / 2)
                );
                state.simulation.alpha(1).restart();
            });
        }

        async function postRequest(url) {
            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                });
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                await loadData();
            } catch (error) {
                console.error("Error with the fetch operation:", error);
            }
        }

        document
            .getElementById("toggleGrainsButton")
            .addEventListener("click", () => {
                isPaused = !isPaused;
                if (isPaused)
                    document.getElementById("toggleGrainsButton").innerHTML = "Unpause";
                else document.getElementById("toggleGrainsButton").innerHTML = "Pause";
            });
    </script>
</body>
</html>
